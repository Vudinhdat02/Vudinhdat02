<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vũ Đình Đạt — Software R&amp;D Engineer - IoT Embedded" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif}
      .trace{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:14 220;animation:flow 4s linear infinite}
      .t2{animation-delay:-2s;animation-duration:5s}
      .base{fill:none;stroke:#e2e8f0;stroke-width:2}
      .prop{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
      .drone{animation:hover 4s ease-in-out infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .fade{opacity:0;animation:in .9s ease-out forwards}
      .d2{animation-delay:.3s}
      @keyframes flow{to{stroke-dashoffset:-234}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <path class="base" d="M0 270H320L340 255H640"/>
    <path class="base" d="M1200 34H1030L1010 50H820"/>
    <path class="trace" stroke="#06b6d4" d="M0 270H320L340 255H640"/>
    <path class="trace t2" stroke="#8b5cf6" d="M1200 34H1030L1010 50H820"/>
    <circle class="pulse" cx="640" cy="255" r="4" fill="#06b6d4"/>
    <circle class="pulse" cx="820" cy="50" r="4" fill="#8b5cf6"/>

    <g transform="translate(80 0)">
      <rect class="fade" x="0" y="74" width="56" height="6" rx="3" fill="#06b6d4"/>
      <text class="sans fade" x="-4" y="170" font-size="74" font-weight="800" fill="url(#name)">Vũ Đình Đạt</text>
      <text class="sans fade d2" x="0" y="218" font-size="28" font-weight="500" fill="#334155">Software R&amp;D Engineer - IoT Embedded</text>
    </g>

    <g transform="translate(940 150)">
      <ellipse cx="0" cy="112" rx="110" ry="9" fill="#0f172a" opacity=".06"/>
      <g class="drone">
        <g stroke="#cbd5e1" stroke-width="7" stroke-linecap="round">
          <line x1="-74" y1="-46" x2="74" y2="46"/><line x1="74" y1="-46" x2="-74" y2="46"/>
        </g>
        <g stroke="#06b6d4" stroke-width="2" stroke-linecap="round">
          <line x1="-74" y1="-46" x2="74" y2="46"/><line x1="74" y1="-46" x2="-74" y2="46"/>
        </g>
        <g fill="none" stroke-opacity=".3" stroke-width="1.5">
          <circle cx="-74" cy="-46" r="38" stroke="#06b6d4"/><circle cx="74" cy="-46" r="38" stroke="#06b6d4"/>
          <circle cx="-74" cy="46" r="38" stroke="#8b5cf6"/><circle cx="74" cy="46" r="38" stroke="#8b5cf6"/>
        </g>
        <g fill="#ffffff" stroke-width="2">
          <circle cx="-74" cy="-46" r="9" stroke="#06b6d4"/><circle cx="74" cy="-46" r="9" stroke="#06b6d4"/>
          <circle cx="-74" cy="46" r="9" stroke="#8b5cf6"/><circle cx="74" cy="46" r="9" stroke="#8b5cf6"/>
        </g>
        <g fill="none" stroke-width="3" stroke-linecap="round">
          <path class="prop" stroke="#0891b2" d="M-112 -46H-36"/><path class="prop" stroke="#0891b2" d="M36 -46H112"/>
          <path class="prop" stroke="#7c3aed" d="M-112 46H-36"/><path class="prop" stroke="#7c3aed" d="M36 46H112"/>
        </g>
        <rect x="-30" y="-26" width="60" height="52" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <rect x="-17" y="-13" width="34" height="26" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
        <circle class="pulse" cx="0" cy="0" r="4" fill="#10b981"/>
        <g fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round">
          <path class="pulse" d="M-10 -40a14 14 0 0 1 20 0"/>
          <path class="pulse" style="animation-delay:-.8s" d="M-18 -48a26 26 0 0 1 36 0"/>
        </g>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>
</svg>

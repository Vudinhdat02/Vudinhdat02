<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Vũ Đình Đạt — Software &amp; IoT Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif}
      .trace{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:14 220;animation:flow 4s linear infinite}
      .t2{animation-delay:-1.3s;animation-duration:5s}
      .t3{animation-delay:-2.6s;animation-duration:6s}
      .base{fill:none;stroke:#1f2a44;stroke-width:2}
      .node{animation:pulse 2.4s ease-in-out infinite}
      .n2{animation-delay:-.8s}.n3{animation-delay:-1.6s}
      .cursor{animation:blink 1s steps(1) infinite}
      .prop{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
      .drone{animation:hover 4s ease-in-out infinite}
      .fade{opacity:0;animation:in .9s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes flow{to{stroke-dashoffset:-234}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>

    <!-- circuit traces -->
    <g>
      <path class="base" d="M0 322H300L316 312H620"/>
      <path class="base" d="M1200 40H1010L970 80H760"/>
      <path class="base" d="M1200 322H1080L1064 312H900"/>
      <path class="base" d="M600 0V30L640 70H720"/>
      <path class="trace" stroke="#22d3ee" d="M0 322H300L316 312H620"/>
      <path class="trace t2" stroke="#a78bfa" d="M1200 40H1010L970 80H760"/>
      <path class="trace t3" stroke="#e879f9" d="M1200 322H1080L1064 312H900"/>
      <path class="trace t2" stroke="#22d3ee" d="M600 0V30L640 70H720"/>
      <circle class="node" cx="620" cy="312" r="4" fill="#22d3ee"/>
      <circle class="node n2" cx="760" cy="80" r="4" fill="#a78bfa"/>
      <circle class="node n3" cx="900" cy="312" r="4" fill="#e879f9"/>
      <circle class="node" cx="720" cy="70" r="4" fill="#22d3ee"/>
    </g>

    <!-- left: identity -->
    <g transform="translate(70 0)">
      <text class="sans fade d1" x="0" y="88" font-size="22" font-weight="600" fill="#64748b">
        <tspan fill="#22d3ee">~/dathoaqua</tspan><tspan fill="#94a3b8"> $ </tspan><tspan fill="#cbd5e1">whoami</tspan>
      </text>
      <text class="sans fade d2" x="-3" y="160" font-size="70" font-weight="800" letter-spacing="1" fill="url(#name)">VŨ ĐÌNH ĐẠT</text>
      <text class="sans fade d3" x="0" y="206" font-size="29" font-weight="600" fill="#e2e8f0">Software R&amp;D Engineer · IoT &amp; Embedded</text>
      <g class="sans fade d4" font-size="17" font-weight="600">
        <rect x="0" y="226" width="108" height="34" rx="17" fill="#0e7490" fill-opacity=".25" stroke="#22d3ee" stroke-opacity=".6"/>
        <text x="54" y="249" text-anchor="middle" fill="#67e8f9">ESP32</text>
        <rect x="118" y="226" width="108" height="34" rx="17" fill="#4338ca" fill-opacity=".25" stroke="#818cf8" stroke-opacity=".6"/>
        <text x="172" y="249" text-anchor="middle" fill="#a5b4fc">STM32</text>
        <rect x="236" y="226" width="118" height="34" rx="17" fill="#7e22ce" fill-opacity=".25" stroke="#c084fc" stroke-opacity=".6"/>
        <text x="295" y="249" text-anchor="middle" fill="#d8b4fe">Android</text>
        <rect x="364" y="226" width="118" height="34" rx="17" fill="#be185d" fill-opacity=".22" stroke="#f472b6" stroke-opacity=".6"/>
        <text x="423" y="249" text-anchor="middle" fill="#f9a8d4">.NET API</text>
        <rect x="492" y="226" width="88" height="34" rx="17" fill="#047857" fill-opacity=".22" stroke="#34d399" stroke-opacity=".6"/>
        <text x="536" y="249" text-anchor="middle" fill="#6ee7b7">Web</text>
      </g>
      <text class="sans fade d4" x="0" y="298" font-size="20" fill="#94a3b8">
        <tspan fill="#a78bfa">❯</tspan> building software that runs from the cloud down to the flight controller<tspan class="cursor" fill="#22d3ee"> ▍</tspan>
      </text>
    </g>

    <!-- right: quadcopter -->
    <g transform="translate(935 175)">
      <ellipse cx="0" cy="118" rx="120" ry="10" fill="#22d3ee" opacity=".08"/>
      <g class="drone">
        <g stroke="#334155" stroke-width="7" stroke-linecap="round">
          <line x1="-78" y1="-48" x2="78" y2="48"/>
          <line x1="78" y1="-48" x2="-78" y2="48"/>
        </g>
        <g stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity=".85">
          <line x1="-78" y1="-48" x2="78" y2="48"/>
          <line x1="78" y1="-48" x2="-78" y2="48"/>
        </g>
        <!-- motors + props -->
        <g>
          <circle cx="-78" cy="-48" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
          <circle cx="78" cy="-48" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
          <circle cx="-78" cy="48" r="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
          <circle cx="78" cy="48" r="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
          <g fill="none" stroke-width="3" stroke-linecap="round">
            <path class="prop" stroke="#67e8f9" d="M-118 -48H-38"/>
            <path class="prop" stroke="#67e8f9" d="M38 -48H118"/>
            <path class="prop" stroke="#c4b5fd" d="M-118 48H-38"/>
            <path class="prop" stroke="#c4b5fd" d="M38 48H118"/>
          </g>
          <g fill="none" stroke-opacity=".25" stroke-width="1.5">
            <circle cx="-78" cy="-48" r="40" stroke="#22d3ee"/>
            <circle cx="78" cy="-48" r="40" stroke="#22d3ee"/>
            <circle cx="-78" cy="48" r="40" stroke="#a78bfa"/>
            <circle cx="78" cy="48" r="40" stroke="#a78bfa"/>
          </g>
        </g>
        <!-- body / flight controller -->
        <rect x="-30" y="-26" width="60" height="52" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
        <rect x="-18" y="-14" width="36" height="28" rx="4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
        <g stroke="#22d3ee" stroke-width="1.5" opacity=".7">
          <line x1="-12" y1="-20" x2="-12" y2="-14"/><line x1="0" y1="-20" x2="0" y2="-14"/><line x1="12" y1="-20" x2="12" y2="-14"/>
          <line x1="-12" y1="14" x2="-12" y2="20"/><line x1="0" y1="14" x2="0" y2="20"/><line x1="12" y1="14" x2="12" y2="20"/>
        </g>
        <circle class="node" cx="0" cy="0" r="4" fill="#34d399"/>
        <!-- telemetry -->
        <g class="sans" font-size="14" font-weight="600" fill="#94a3b8">
          <text x="-120" y="-104">ESP-NOW ▸ CRC16 OK</text>
          <text x="40" y="104">PID · ALT HOLD</text>
        </g>
        <!-- signal arcs -->
        <g fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round">
          <path class="node" d="M-10 -40a14 14 0 0 1 20 0"/>
          <path class="node n2" d="M-18 -48a26 26 0 0 1 36 0"/>
          <path class="node n3" d="M-26 -56a38 38 0 0 1 52 0"/>
        </g>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
